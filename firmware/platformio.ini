; ESP32 firmware for the slam-robot base. One environment per program:
;   base          the robot firmware: wheel-speed loops, serial protocol for the Pi
;   encoder_test  bench check of the wheel encoders (quadrature validity, ticks per revolution)
;   motor_test    motors + encoders on the robot: direction, start-up duty, stall cutoff
;   (the MPU6050 is on the Pi, see slam_robot_imu)
[platformio]
default_envs = base

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200   ; the default 460800 failed ("Failed to start stub flasher")
build_flags = -Wall

[env:encoder_test]
build_src_filter = -<*> +<encoder_test/>

[env:motor_test]
build_src_filter = -<*> +<motor_test/>

[env:base]
build_src_filter = -<*> +<base/>
