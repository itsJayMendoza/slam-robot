imu:
  ros__parameters:
    i2c_bus: 1                 # /dev/i2c-1 = header pins 3 (SDA) and 5 (SCL)
    address: 0x68              # AD0 unconnected or to GND; 0x69 if AD0 is tied to 3.3 V
    frame_id: imu_link
    topic: imu/data_raw
    rate_hz: 100.0
    gyro_range_dps: 250        # slow robot: the smallest range gives the finest resolution
    accel_range_g: 2
    dlpf: 3                    # on-chip low-pass filter, about 44 Hz
    calibration_samples: 200   # 2 s at 100 Hz, robot standing still
    max_still_gyro_std: 0.02   # rad/s; above this the robot is moving and calibration waits
