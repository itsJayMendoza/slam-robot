# robot_localization EKF: wheel odometry + IMU yaw rate -> odom -> base_footprint.
# Wheels give the forward speed; turning comes from both, weighted by their covariances
# (the gyro is trusted more, wheels slip when turning). Accelerometer not used.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # diff_drive_controller output; velocities only, so wheel position drift does not fight the IMU
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # MPU6050 (imu_node): z angular velocity only; the bias is removed at start-up
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 20
