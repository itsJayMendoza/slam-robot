# YDLidar X3 (115200 baud). It streams continuously and never answers the health command, so
# isSingleChannel must be true (false gives "cannot retrieve Lidar health code -2"). Verified on the robot: ~6.5 Hz.
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_link
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    sample_rate: 4
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: true
    intensity: false
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 10.0
    range_min: 0.12
    frequency: 8.0
    invalid_range_is_inf: false
